<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Time Tracker Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 24px;
    }

    header {
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 24px;
      font-weight: 600;
      color: #f8fafc;
    }

    header p {
      color: #94a3b8;
      margin-top: 4px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 24px;
    }

    .card h2 {
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }

    .chart-wrap {
      position: relative;
      height: 280px;
    }

    /* Stat bar rows */
    .stat-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .stat-label {
      width: 120px;
      font-size: 13px;
      color: #cbd5e1;
      flex-shrink: 0;
    }

    .stat-bar-wrap {
      flex: 1;
      background: #2d3148;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }

    .stat-bar {
      height: 100%;
      border-radius: 99px;
      transition: width 0.8s ease;
    }

    .stat-value {
      font-size: 13px;
      color: #94a3b8;
      width: 60px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Log table */
    .log-card { margin-bottom: 24px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      padding: 8px 12px;
      color: #64748b;
      font-weight: 500;
      border-bottom: 1px solid #2d3148;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #1a1f2e;
      color: #cbd5e1;
    }

    tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 500;
    }

    .empty {
      color: #475569;
      text-align: center;
      padding: 40px 0;
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
    }

    #clearBtn {
      background: transparent;
      border: 1px solid #f43f5e;
      color: #f43f5e;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #clearBtn:hover {
      background: #f43f5e22;
    }

    #clearBtn.confirming {
      border-color: #fb923c;
      color: #fb923c;
    }
  </style>
</head>
<body>

<header>
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div>
      <h1>Time Tracker Dashboard</h1>
      <p>{{ today }}</p>
    </div>
    <button id="clearBtn" onclick="clearToday()">Clear Today</button>
  </div>
</header>

<div class="grid">
  <!-- Pie chart -->
  <div class="card">
    <h2>Time by category</h2>
    <div class="chart-wrap">
      <canvas id="pieChart"></canvas>
    </div>
  </div>

  <!-- Bar breakdown -->
  <div class="card">
    <h2>Breakdown</h2>
    <div id="bars"><p class="empty">No data yet — run tracker.py first.</p></div>
  </div>
</div>

<!-- Session log -->
<div class="card log-card">
  <h2>Recent sessions</h2>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Category</th>
        <th>Window</th>
        <th>Duration</th>
      </tr>
    </thead>
    <tbody id="logBody">
      <tr><td colspan="4" class="empty">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
  // Colour palette for categories
  const COLORS = {
    "Coding":          "#6366f1",
    "Browsing":        "#38bdf8",
    "Entertainment":   "#f43f5e",
    "Communication":   "#34d399",
    "Meeting":         "#fb923c",
    "Documents":       "#a78bfa",
    "System":          "#94a3b8",
    "Uncategorized":   "#475569",
  };

  function getColor(label) {
    return COLORS[label] || "#7dd3fc";
  }

  // --- Pie chart ---
  const ctx = document.getElementById("pieChart").getContext("2d");
  let pieChart = new Chart(ctx, {
    type: "doughnut",
    data: { labels: [], datasets: [{ data: [], backgroundColor: [], borderWidth: 0 }] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: "bottom",
          labels: { color: "#94a3b8", font: { size: 12 }, padding: 16 }
        },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.parsed} min`
          }
        }
      }
    }
  });

  // --- Fetch summary and draw charts ---
  async function loadSummary() {
    const res  = await fetch("/api/summary");
    const data = await res.json();

    if (!data.labels.length) return;

    // Update pie chart
    pieChart.data.labels = data.labels;
    pieChart.data.datasets[0].data = data.values;
    pieChart.data.datasets[0].backgroundColor = data.labels.map(getColor);
    pieChart.update();

    // Draw bar breakdown
    const total = data.values.reduce((a, b) => a + b, 0);
    const barsDiv = document.getElementById("bars");
    barsDiv.innerHTML = data.labels.map((label, i) => {
      const pct = total > 0 ? (data.values[i] / total) * 100 : 0;
      return `
        <div class="stat-row">
          <span class="stat-label">${label}</span>
          <div class="stat-bar-wrap">
            <div class="stat-bar" style="width:${pct}%;background:${getColor(label)}"></div>
          </div>
          <span class="stat-value">${data.values[i]} min</span>
        </div>`;
    }).join("");
  }

  // --- Fetch detail log ---
  async function loadDetail() {
    const res     = await fetch("/api/detail");
    const records = await res.json();
    const tbody   = document.getElementById("logBody");

    if (!records.length) {
      tbody.innerHTML = `<tr><td colspan="4" class="empty">No sessions recorded today.</td></tr>`;
      return;
    }

    tbody.innerHTML = records.map(r => {
      const color = getColor(r.category);
      const time  = r.timestamp.split(" ")[1].slice(0, 5);
      const title = r.window_title.length > 55
                    ? r.window_title.slice(0, 55) + "…"
                    : r.window_title;
      return `
        <tr>
          <td>${time}</td>
          <td><span class="badge" style="background:${color}22;color:${color}">${r.category}</span></td>
          <td>${title}</td>
          <td>${r.duration_seconds}s</td>
        </tr>`;
    }).join("");
  }

  // Load everything on page open
  loadSummary();
  loadDetail();

  // Auto-refresh every 30 seconds
  setInterval(() => { loadSummary(); loadDetail(); }, 30000);



  // --- Clear today's data ---
  let clearClicks = 0;

  async function clearToday() {
    const btn = document.getElementById("clearBtn");

    // First click: ask for confirmation
    if (clearClicks === 0) {
      btn.textContent = "Are you sure?";
      btn.classList.add("confirming");
      clearClicks = 1;

      // Reset button if user doesn't click again within 3 seconds
      setTimeout(() => {
        if (clearClicks === 1) {
          btn.textContent = "Clear Today";
          btn.classList.remove("confirming");
          clearClicks = 0;
        }
      }, 3000);
      return;
    }

    // Second click: actually clear
    clearClicks = 0;
    btn.textContent = "Clearing...";
    btn.disabled = true;

    await fetch("/api/clear", { method: "POST" });

    // Reload charts and log after clearing
    await loadSummary();
    await loadDetail();

    btn.textContent = "Clear Today";
    btn.disabled = false;
    btn.classList.remove("confirming");
  }
</script>

</body>
</html>
